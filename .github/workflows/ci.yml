name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # AC-SEC-1 pins the scanner the way every other tool here is pinned. A security gate that
  # follows a moving tag changes what it checks without anyone editing this file.
  GITLEAKS_VERSION: 8.30.1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # AC-SEC-1 scans the FULL history, and the default shallow clone has none of it: a
          # depth-1 checkout would let the scan pass by having nothing to look at.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every step below is blocking. No continue-on-error anywhere in this file.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:pipeline
      - run: pnpm validate:content
      - name: licence completeness (AC-SEC-5, AC-LAND-11)
        run: pnpm check:licenses
      - name: dark parity, static half (AC-APP-15)
        run: pnpm token-audit
      # `pnpm build` ends in `check:build` and `check:bundle`, which is where AC-PERF-6, 7 and 8
      # and the AC-PERF-1 per-route initial-JS budgets are asserted. Both exit non-zero on a
      # blown budget, so the build is the enforcement and there is no separate report step to
      # forget to read.
      - run: pnpm build

      - name: dependency audit (AC-SEC-2)
        run: pnpm audit --audit-level high

      - name: secret scan over the full history (AC-SEC-1)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --log-opts=--all --redact --exit-code 1

  e2e:
    # Its own job because it is the slow half: most of these configs build the app and serve the
    # dist before a single test runs. Failing here fails the workflow exactly as `verify` does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # chromium for every suite; firefox and webkit for the cross-browser matrix only
      # (AC-APP-21, AC-LAND-14), which is the one config that declares projects for them.
      - run: pnpm exec playwright install --with-deps chromium firefox webkit

      # --ignore-snapshots, and why, stated rather than buried. The committed baselines are
      # `-darwin`: the configs put the platform in the snapshot path precisely because linux and
      # macOS rasterise text differently, so a linux runner has no baseline to compare against and
      # would fail every toHaveScreenshot on the first run for a reason that is not a regression.
      # What CI asserts is therefore everything else in these specs, which is most of them:
      # behaviour, routing, DOM structure, copy, console hygiene (AC-APP-22), same-origin traffic
      # (AC-SEC-6), the CSP (AC-SEC-3) and the link audit (AC-SEC-4). The pixel comparison stays a
      # local gate on darwin. Upgrade path: commit linux baselines generated in the official
      # Playwright container and drop this flag.
      - name: grammar panels (AC-GRAM)
        run: pnpm test:e2e --ignore-snapshots
      - name: app states and flows (AC-APP)
        run: pnpm test:e2e:app --ignore-snapshots
      - name: offline (AC-APP-17)
        run: pnpm test:e2e:offline --ignore-snapshots
      - name: landing, security and licences (AC-LAND, AC-SEC-3/4/6)
        run: pnpm test:e2e:landing --ignore-snapshots
      - name: research surface (AC-RES)
        run: pnpm test:e2e:research --ignore-snapshots
      - name: axe, light and dark (AC-LAND-10, AC-PERF-3 floor)
        run: pnpm test:e2e:a11y --ignore-snapshots
      - name: chromium, firefox and webkit (AC-APP-21, AC-LAND-14)
        run: pnpm test:e2e:cross --ignore-snapshots
      - name: scroll choreography and reduced motion (AC-LAND-6, AC-LAND-7)
        run: pnpm test:e2e:motion --ignore-snapshots

      # Every tests/e2e/*.config.ts belongs on this list. A config with no step here is a suite
      # that rots: it passes on the machine of whoever wrote it and nowhere else. Adding one is
      # a package.json script plus two lines above.

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  lighthouse:
    # Its own job because it is the one suite whose result is a NUMBER rather than a pass, and
    # numbers move with the machine. Two runs, three medians each: mobile emulation over `/` and
    # `/app` (AC-LAND-8's Core Web Vitals, AC-LAND-9's four mobile category floors, AC-PERF-3's
    # two app floors) and desktop over `/` (AC-LAND-9's desktop performance floor).
    #
    # Every threshold lives in lighthouserc.json and lighthouserc.desktop.json as an `error`
    # assertion, so lhci exits non-zero on a miss and this job fails. There is no reporting-only
    # mode anywhere in either file: a budget nobody can fail is not a budget.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lighthouse drives Chrome through chrome-launcher, which honours CHROME_PATH. Pointing it
      # at the Playwright chromium this repo already pins keeps the browser under test the same
      # version the e2e job used, instead of whatever the runner image happens to ship this week.
      - run: pnpm exec playwright install --with-deps chromium
      - name: pin the browser lighthouse drives
        run: echo "CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"

      # Ubuntu 24 runners ship AppArmor rules that block unprivileged user namespaces, so
      # Chrome's sandbox cannot start under chrome-launcher and the run dies before the first
      # audit ("No usable sandbox", FATAL zygote_host). --no-sandbox is scoped to CI only and
      # changes nothing about what is measured or asserted.
      - name: mobile, / and /app (AC-LAND-8, AC-LAND-9, AC-PERF-3)
        run: pnpm lh --collect.settings.chromeFlags="--no-sandbox"
      - name: desktop, / (AC-LAND-9)
        run: pnpm lh:desktop --collect.settings.chromeFlags="--no-sandbox"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-report/
          retention-days: 7
